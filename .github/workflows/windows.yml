name: Windows
# Builds and tests bits on real Windows (MSVC) and uploads a zip of the app.
# Linux checks alone don't establish that the Windows build works.
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sync
      - run: npm ci
      - name: Sync core tests (storage, merge rules, pairing, multi-device sync)
        run: cargo test --manifest-path sync/Cargo.toml -p bits-sync
      - run: npm run sync:helper
      - name: Sync helper process test (pairing, kill -9 durability, reconnect)
        run: node --test sync/tests/helper.test.mjs
      - run: npm run build
      - name: Package bits
        run: npx electron-builder --win zip --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: bits-windows-x64
          path: release/*.zip
          if-no-files-found: error
      - name: App tests
        run: npm test
